<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Block World</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
}
canvas{
    display:block;
    width:100%;
    height:100%;
}
#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:5;
}
#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 2px #000;
}
#crosshair:before{
    width:16px;
    height:2px;
    left:0;
    top:7px;
}
#crosshair:after{
    width:2px;
    height:16px;
    left:7px;
    top:0;
}
#hint{
    position:fixed;
    top:12px;
    left:12px;
    padding:8px 12px;
    background:rgba(0,0,0,.55);
    color:white;
    border-radius:7px;
    font:14px Arial;
    z-index:10;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="crosshair"></div>
<div id="hint">Klicken → Maus aktivieren<br>WASD → bewegen</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.05,
    200
);

camera.position.set(0,5,8);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

document.body.appendChild(renderer.domElement);


/* TEXTURE */

function makeTexture(base,spots){

    const c=document.createElement("canvas");
    c.width=16;
    c.height=16;

    const ctx=c.getContext("2d");

    ctx.fillStyle=base;
    ctx.fillRect(0,0,16,16);

    for(let i=0;i<45;i++){

        ctx.fillStyle=
            spots[Math.floor(Math.random()*spots.length)];

        ctx.fillRect(
            Math.floor(Math.random()*16),
            Math.floor(Math.random()*16),
            1+Math.floor(Math.random()*2),
            1+Math.floor(Math.random()*2)
        );
    }

    const t=new THREE.CanvasTexture(c);

    t.magFilter=THREE.NearestFilter;
    t.minFilter=THREE.NearestFilter;

    return t;
}

const grass=makeTexture("#5fa13b",[
    "#4b8730",
    "#70b64b",
    "#568f35"
]);

const dirt=makeTexture("#80502f",[
    "#623a21",
    "#956039",
    "#704328"
]);

const stone=makeTexture("#888888",[
    "#707070",
    "#999999",
    "#777777"
]);


/* MATERIALIEN */

const grassMat=new THREE.MeshLambertMaterial({
    map:grass
});

const dirtMat=new THREE.MeshLambertMaterial({
    map:dirt
});

const stoneMat=new THREE.MeshLambertMaterial({
    map:stone
});


/* WELT */

const cube=new THREE.BoxGeometry(1,1,1);

for(let x=-18;x<=18;x++){

    for(let z=-18;z<=18;z++){

        const h=
            3+
            Math.floor(
                Math.sin(x*.35)+
                Math.cos(z*.3)
            );

        for(let y=0;y<h;y++){

            let material;

            if(y===h-1)
                material=grassMat;
            else if(y>0)
                material=stoneMat;
            else
                material=dirtMat;

            const block=new THREE.Mesh(
                cube,
                material
            );

            block.position.set(x,y,z);

            scene.add(block);
        }
    }
}


/* LICHT */

const sun=new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sun.position.set(20,40,10);

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        1
    )
);


/* POINTER LOCK */

function activatePointer(){

    if(document.pointerLockElement!==renderer.domElement){

        renderer.domElement.requestPointerLock()
        .catch(()=>{});

    }
}

renderer.addEventListener(
    "click",
    activatePointer
);

renderer.addEventListener(
    "mousedown",
    activatePointer
);


/* MAUS */

let yaw=0;
let pitch=0;

document.addEventListener("mousemove",e=>{

    if(
        document.pointerLockElement
        !==renderer.domElement
    ) return;

    yaw-=e.movementX*0.0025;
    pitch-=e.movementY*0.0025;

    pitch=Math.max(
        -Math.PI/2+0.05,
        Math.min(
            Math.PI/2-0.05,
            pitch
        )
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
});


/* TASTEN */

const keys={};

document.addEventListener("keydown",e=>{

    keys[e.code]=true;

});

document.addEventListener("keyup",e=>{

    keys[e.code]=false;

});


/* BEWEGUNG */

const velocity=new THREE.Vector3();

function update(){

    if(
        document.pointerLockElement
        !==renderer.domElement
    ) return;

    const forward=new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    const right=new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );

    const move=new THREE.Vector3();

    if(keys["KeyW"])
        move.add(forward);

    if(keys["KeyS"])
        move.sub(forward);

    if(keys["KeyD"])
        move.add(right);

    if(keys["KeyA"])
        move.sub(right);

    if(move.lengthSq()>0){

        move.normalize();

        camera.position.x+=move.x*.12;
        camera.position.z+=move.z*.12;

    }

    /* Boden */

    const floorY=4;

    camera.position.y=floorY;

}


/* LOOP */

function loop(){

    requestAnimationFrame(loop);

    update();

    renderer.render(
        scene,
        camera
    );
}

loop();


/* RESIZE */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
